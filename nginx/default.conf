# Reverse proxy SmartNuggets : application React + API FastAPI sur le même domaine (pas de CORS).
server_tokens off;

# Journal d'accès sans la query string : /stream et /image reçoivent le jeton JWT en
# ?token=..., il ne doit jamais se retrouver dans les journaux.
log_format sans_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent" $request_time';

# Anti force brute : 10 requêtes par minute et par IP sur la connexion et l'inscription.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

# Pareil pour l'ajout d'un poulailler (POST /coops), qui demande le code d'appairage du Pi.
# Clé vide pour les autres méthodes : la liste des poulaillers (GET) n'est pas limitée.
map $request_method $claim_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $claim_limit_key zone=claim:10m rate=10r/m;

upstream smartnuggets_api {
    server backend:8000;
}

# HTTPS : certificat Let's Encrypt de smartnuggets.be et www.smartnuggets.be, créé et
# renouvelé par certbot sur le VPS (dossier /etc/letsencrypt monté en lecture seule).
ssl_certificate     /etc/letsencrypt/live/smartnuggets.be/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/smartnuggets.be/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Port 80 (HTTP) : seulement la vérification de Let's Encrypt, tout le reste est renvoyé
# vers https://smartnuggets.be (y compris http://15.235.251.11 et http://www...).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Remplace le journal "main" hérité de nginx.conf (qui contient la query string).
    access_log /var/log/nginx/access.log sans_query;

    # Fichiers de vérification écrits par certbot --webroot lors du renouvellement.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://smartnuggets.be$request_uri;
    }
}

# HTTPS avec un autre nom (par exemple https://15.235.251.11) : connexion refusée, sans
# montrer de certificat.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.smartnuggets.be;
    access_log /var/log/nginx/access.log sans_query;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://smartnuggets.be$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name smartnuggets.be;

    # Remplace le journal "main" hérité de nginx.conf (qui contient la query string).
    access_log /var/log/nginx/access.log sans_query;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # HSTS : le navigateur n'utilise plus que HTTPS pour ce site pendant un an.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Flux temps réel (Server-Sent Events) : pas de mise en tampon, connexion longue.
    location ~ ^/api/v1/coops/[^/]+/stream$ {
        proxy_pass http://smartnuggets_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://smartnuggets_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/coops {
        limit_req zone=claim burst=5 nodelay;
        proxy_pass http://smartnuggets_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API REST et documentation OpenAPI.
    location ~ ^/(api/|docs|openapi\.json) {
        proxy_pass http://smartnuggets_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers générés par Vite (nom avec empreinte) : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Application monopage : toutes les autres routes renvoient index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
