# Reverse proxy SmartNuggets : application React + API FastAPI sur le même domaine (pas de CORS).
server_tokens off;

# Journal d'accès sans la query string : /stream et /image reçoivent le jeton JWT en
# ?token=..., il ne doit jamais se retrouver dans les journaux.
log_format sans_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent" $request_time';

# Anti force brute : 10 requêtes par minute et par IP sur la connexion et l'inscription.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

upstream smartnuggets_api {
    server backend:8000;
}

server {
    listen 80 default_server;
    server_name _;

    # Remplace le journal "main" hérité de nginx.conf (qui contient la query string).
    access_log /var/log/nginx/access.log sans_query;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Flux temps réel (Server-Sent Events) : pas de mise en tampon, connexion longue.
    location ~ ^/api/v1/coops/[^/]+/stream$ {
        proxy_pass http://smartnuggets_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://smartnuggets_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API REST et documentation OpenAPI.
    location ~ ^/(api/|docs|openapi\.json) {
        proxy_pass http://smartnuggets_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers générés par Vite (nom avec empreinte) : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Application monopage : toutes les autres routes renvoient index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
