# Intégration continue : lint, sécurité et tests à chaque pull request et sur main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  lint-and-security:
    name: Python - lint et sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            edge-coop/pyproject.toml
      - name: Installer les dépendances
        run: |
          # pip et setuptools sont préinstallés dans l'image GitHub : on les met à jour pour
          # que pip-audit ne signale que les failles de nos propres dépendances.
          python -m pip install --upgrade pip setuptools
          pip install -e "backend[dev]" -e "edge-coop[dev]" pip-audit
      - name: Backend - ruff, black, bandit
        working-directory: backend
        run: |
          ruff check .
          black --check .
          bandit -q -r app
      - name: Raspberry Pi - ruff, black, bandit
        working-directory: edge-coop
        run: |
          ruff check .
          black --check .
          bandit -q -r mqtt_uplink hardware ai_detector
      - name: Vulnérabilités connues des dépendances (pip-audit)
        run: pip-audit --skip-editable

  backend-tests:
    name: Backend - migrations et tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartnuggets
          POSTGRES_PASSWORD: smartnuggets
          POSTGRES_DB: smartnuggets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartnuggets"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://smartnuggets:smartnuggets@localhost:5432/smartnuggets_test
      TEST_DATABASE_URL: postgresql+asyncpg://smartnuggets:smartnuggets@localhost:5432/smartnuggets_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Migrations Alembic (montée, cohérence avec les modèles, descente)
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: couverture-backend
          path: backend/coverage.xml

  edge-tests:
    name: Raspberry Pi - tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-coop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: edge-coop/pyproject.toml
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend - lint, tests et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Tests (Vitest)
        run: npm test
      - name: Build (TypeScript + Vite)
        run: npm run build
      - name: Vulnérabilités connues des dépendances (npm audit)
        run: npm audit --audit-level=high
