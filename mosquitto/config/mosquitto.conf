# Broker MQTT SmartNuggets (conteneur eclipse-mosquitto:2 sur le VPS).
# Création des comptes et des certificats : voir mosquitto/README.md.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Comptes et droits communs à tous les ports : aucun accès anonyme.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Port public, utilisé par les Raspberry Pi des poulaillers : TLS obligatoire.
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

# Port réservé à l'API, sur le réseau Docker interne (backend_net).
# Il n'est PAS publié dans docker-compose : inaccessible depuis Internet.
listener 1883
