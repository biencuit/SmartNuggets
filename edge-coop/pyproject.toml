[project]
name = "smartnuggets-edge"
version = "0.1.0"
description = "Code embarqué du Raspberry Pi du poulailler SmartNuggets"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1",
]

[project.optional-dependencies]
# Sur le Raspberry Pi 5 (Picamera2 s'installe avec apt : sudo apt install python3-picamera2).
pi = [
    "gpiozero>=2.0",
    "lgpio>=0.2",
]
# Rejouer une vidéo enregistrée à la place de la caméra.
video = [
    "opencv-python-headless>=4.10",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.8",
    "bandit>=1.7.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mqtt_uplink*", "hardware*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mqtt_uplink", "hardware"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["mqtt_uplink", "hardware"]
omit = [
    "mqtt_uplink/__main__.py",
    # matériel réel : testé sur le Raspberry Pi (wiki, page 9 D)
    "hardware/gpio.py",
    "hardware/camera.py",
]
