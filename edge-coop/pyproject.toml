[project]
name = "smartnuggets-edge"
version = "0.1.0"
description = "Code embarqué du Raspberry Pi du poulailler SmartNuggets"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.8",
    "bandit>=1.7.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mqtt_uplink*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mqtt_uplink"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["mqtt_uplink"]
omit = ["mqtt_uplink/__main__.py"]
